spring.application.name=ecomarket-backend
server.port=${PORT:8080}

# Base de datos PostgreSQL (crear antes la base ecomarket_db en pgAdmin 4).
# En produccion la contrasena se define con la variable de entorno DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecomarket_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT: JWT_SECRETO debe ser un texto Base64 de al menos 32 bytes. El valor por defecto es solo para desarrollo.
jwt.secreto=${JWT_SECRETO:ZWNvbWFya2V0LWRlc2Fycm9sbG8tY2xhdmUtc2VjcmV0YS1qd3QtMjAyNg==}
jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:120}

# Administrador inicial (TS08). Se crea al arrancar si no existe.
admin.correo=${ADMIN_CORREO:admin@ecomarket.pe}
admin.contrasena=${ADMIN_CONTRASENA:Admin12345}

# Origen del frontend permitido por CORS
cors.origenes=${CORS_ORIGENES:http://localhost:4200}

# Geocodificacion con OpenStreetMap Nominatim (gratis, sin API key) (TS10).
geocodificacion.habilitada=${GEOCODIFICACION_HABILITADA:true}
geocodificacion.url=${GEOCODIFICACION_URL:https://nominatim.openstreetmap.org}
geocodificacion.agente=${GEOCODIFICACION_AGENTE:EcoMarket-UPC/1.0 (proyecto academico)}

# Google Gemini para sugerir Eco-Etiquetas (TS06). La API key va SOLO en la variable de entorno GEMINI_API_KEY.
# Sin clave, o si Gemini falla o tarda mas de gemini.tiempo-espera-segundos, se usan las palabras clave.
gemini.api-key=${GEMINI_API_KEY:}
gemini.modelo=${GEMINI_MODELO:gemini-2.5-flash}
gemini.url=${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.tiempo-espera-segundos=${GEMINI_TIEMPO_ESPERA:10}
