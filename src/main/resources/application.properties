spring.application.name=ecomarket-backend
server.port=${PORT:8080}

# Base de datos (MySQL). Las credenciales se leen de variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecomarket?createDatabaseIfNotExist=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT. JWT_SECRET debe ser un texto Base64 de al menos 32 bytes; el valor por defecto es solo para desarrollo.
app.jwt.secret=${JWT_SECRET:ZWNvbWFya2V0LWRldi1zZWNyZXQtY2FtYmlhci1lbi1wcm9kdWNjaW9uLTIwMjY=}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Administrador inicial: se crea al arrancar si no existe ningun administrador.
app.admin.email=${ADMIN_EMAIL:admin@ecomarket.pe}
app.admin.password=${ADMIN_PASSWORD:Admin12345!}

# Origenes permitidos para el frontend (Angular)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Geocoding con OpenStreetMap Nominatim (gratis, sin API key). Solo se usa si el comercio no envia latitud y longitud.
app.geocoding.enabled=${GEOCODING_ENABLED:true}
app.geocoding.nominatim-url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
app.geocoding.user-agent=${GEOCODING_USER_AGENT:EcoMarket-UPC/1.0 (proyecto academico)}

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
